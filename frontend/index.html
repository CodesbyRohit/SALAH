<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salah — Business Partner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f1117;
    color: #e8eaf0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  header { text-align: center; margin-bottom: 16px; }
  header h1 { font-size: 1.6rem; letter-spacing: 1px; }
  header p { color: #9aa0b0; font-size: 0.9rem; margin-top: 4px; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    width: 100%;
    max-width: 760px;
    margin-bottom: 16px;
  }
  .card {
    background: #181b24;
    border: 1px solid #262a36;
    border-radius: 12px;
    padding: 14px;
  }
  .card .label { color: #9aa0b0; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .card .value { font-size: 1.35rem; font-weight: 700; margin-top: 6px; }
  .card .sub { color: #7c8296; font-size: 0.72rem; margin-top: 4px; }
  .chat {
    width: 100%;
    max-width: 760px;
    background: #181b24;
    border: 1px solid #262a36;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    height: 380px;
    margin-bottom: 12px;
  }
  #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #2b4a8f; }
  .msg.assistant { align-self: flex-start; background: #232733; }
  .controls {
    width: 100%;
    max-width: 760px;
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  #input {
    flex: 1;
    background: #181b24;
    border: 1px solid #262a36;
    border-radius: 10px;
    color: #e8eaf0;
    padding: 12px 14px;
    font-size: 0.95rem;
    outline: none;
  }
  button {
    background: #2b4a8f;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.mic { background: #1f6f43; }
  button.ghost { background: transparent; border: 1px solid #3a3f4f; color: #9aa0b0; }
  #tracePanel {
    width: 100%;
    max-width: 760px;
    background: #12141b;
    border: 1px dashed #3a3f4f;
    border-radius: 12px;
    padding: 14px;
    font-family: 'Consolas', monospace;
    font-size: 0.78rem;
    color: #9aa0b0;
    min-height: 60px;
  }
  #tracePanel h3 { font-family: 'Segoe UI', sans-serif; font-size: 0.8rem; color: #c7cbd6; margin-bottom: 8px; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 0.68rem; font-weight: 700; margin-right: 6px; }
  .badge.FACT { background: #1f4d2e; color: #7ee2a0; }
  .badge.PATTERN { background: #4d3a12; color: #e8c26a; }
  .badge.HYPOTHESIS { background: #12384d; color: #6ac6e8; }
  .badge.UNKNOWN { background: #3a3f4f; color: #b0b5c2; }
  .status { color: #6c7284; font-size: 0.75rem; text-align: center; height: 16px; margin-bottom: 6px; }
</style>
</head>
<body>
<header>
  <h1>🙏 Salah</h1>
  <p>Aapka business partner — voice mein poochho, seedha jawab pao.</p>
</header>

<div class="cards">
  <div class="card"><div class="label">Is Hafte ki Kamai</div><div class="value" id="mWeek">—</div><div class="sub" id="mWeekSub"></div></div>
  <div class="card"><div class="label">Sabse Kamzor Din</div><div class="value" id="mWeak">—</div><div class="sub" id="mWeakSub"></div></div>
  <div class="card"><div class="label">Evening Share</div><div class="value" id="mEvening">—</div><div class="sub" id="mEveningSub"></div></div>
  <div class="card"><div class="label">Purane Customers</div><div class="value" id="mLapsed">—</div><div class="sub" id="mLapsedSub"></div></div>
</div>

<div class="chat"><div id="messages"></div></div>

<div class="status" id="status"></div>

<div class="controls">
  <button class="mic" id="micBtn" title="Boliye">🎤 Bol kar poochho</button>
  <input id="input" placeholder="Ya type karke poochho... (jaise: is hafte kitna kamaya)">
  <button id="sendBtn">➤</button>
  <button class="ghost" id="nudgeBtn" title="Proactive nudge">🔔</button>
  <button class="ghost" id="resetBtn" title="Reset conversation">↺</button>
</div>

<div id="tracePanel">
  <h3>🔍 Glass-box trace (developers ke liye)</h3>
  <div id="traceBody">Koi trace nahi. Sawal poochho.</div>
</div>

<audio id="ttsAudio" style="display:none"></audio>

<script>
const API = "";
const $ = (id) => document.getElementById(id);
const messages = $("messages");
let recording = false, mediaRecorder = null, chunks = [];

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function setStatus(t) { $("status").textContent = t || ""; }

async function loadContext() {
  try {
    const r = await fetch(API + "/context");
    const c = await r.json();
    const wk = (c.weekly_revenue || []);
    const last = wk.length ? wk[wk.length - 1] : null;
    $("mWeek").textContent = last ? "₹" + last.revenue.toLocaleString("en-IN") : "₹0";
    $("mWeekSub").textContent = last ? last.week : "";
    const wd = c.weakest_weekday || {};
    $("mWeak").textContent = wd.weekday || "—";
    $("mWeakSub").textContent = wd.avg_daily_revenue != null ? "₹" + wd.avg_daily_revenue + " avg vs ₹" + wd.overall_avg_daily_revenue : "";
    const es = c.evening_share || {};
    $("mEvening").textContent = es.evening_share_pct != null ? es.evening_share_pct + "%" : "—";
    $("mEveningSub").textContent = es.evening_revenue != null ? "₹" + es.evening_revenue.toLocaleString("en-IN") + " evening" : "";
    const lr = c.lapsed_regulars || {};
    $("mLapsed").textContent = lr.count != null ? lr.count : "—";
    $("mLapsedSub").textContent = "regulars jo kam aa rahe hain";
  } catch (e) {
    setStatus("Context load failed: " + e);
  }
}

function renderTrace(trace) {
  const body = $("traceBody");
  if (!trace || !trace.length) {
    body.innerHTML = "Koi trace nahi. Sawal poochho.";
    return;
  }
  body.innerHTML = trace.map(t =>
    `<div style="margin:6px 0">
      <span class="badge ${t.confidence}">${t.confidence}</span>
      <b>${t.signal}</b>: ${t.value}<br>
      <span style="color:#6c7284">→ ${t.implication} · <i>${t.source}</i></span>
    </div>`).join("");
}

async function ask(question) {
  if (!question.trim()) return;
  addMsg("user", question);
  setStatus("Soch raha hoon...");
  $("sendBtn").disabled = true;
  try {
    const r = await fetch(API + "/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question })
    });
    const d = await r.json();
    if (d.detail) throw new Error(d.detail);
    addMsg("assistant", d.answer);
    renderTrace(d.trace);
    if (d.answer) speak(d.answer);
  } catch (e) {
    addMsg("assistant", "⚠️ Connection problem. Dobara koshish karein.");
    setStatus("");
  } finally {
    $("sendBtn").disabled = false;
    setStatus("");
  }
}

async function speak(text) {
  try {
    const r = await fetch(API + "/voice/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text })
    });
    if (!r.ok) return; // voice failure silently falls back to text
    const blob = await r.blob();
    $("ttsAudio").src = URL.createObjectURL(blob);
    $("ttsAudio").play().catch(() => {});
  } catch (e) { /* text fallback */ }
}

async function nudge() {
  setStatus("Nudge laa raha hoon...");
  try {
    const r = await fetch(API + "/nudge", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ force: true })
    });
    const d = await r.json();
    addMsg("assistant", "🔔 " + (d.nudge || d.detail || "Nudge unavailable"));
  } catch (e) {
    addMsg("assistant", "⚠️ Nudge fail hua.");
  } finally { setStatus(""); }
}

async function reset() {
  try { await fetch(API + "/reset", { method: "POST" }); } catch (e) {}
  messages.innerHTML = "";
  renderTrace(null);
  addMsg("assistant", "Nayi shuruaat. Poochho kya poochna hai. 🙏");
}

// ------------------------- voice recording -------------------------
$("micBtn").addEventListener("click", async () => {
  if (!recording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      chunks = [];
      mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
      mediaRecorder.onstop = async () => {
        const blob = new Blob(chunks, { type: "audio/webm" });
        setStatus("Suno raha hoon...");
        try {
          const fd = new FormData();
          fd.append("file", blob, "speech.webm");
          const r = await fetch(API + "/voice/stt", { method: "POST", body: fd });
          const d = await r.json();
          if (d.text) { $("input").value = d.text; ask(d.text); }
          else { setStatus("Samajh nahi aaya — type karke poochho."); }
        } catch (e) { setStatus("Voice fail — type karke poochho."); }
        finally { setStatus(""); }
      };
      mediaRecorder.start();
      recording = true;
      $("micBtn").textContent = "⏹ Rok do";
    } catch (e) { setStatus("Mic access nahi mila."); }
  } else {
    mediaRecorder.stop();
    recording = false;
    $("micBtn").textContent = "🎤 Bol kar poochho";
  }
});

$("sendBtn").addEventListener("click", () => { const q = $("input").value; $("input").value = ""; ask(q); });
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter") { const q = $("input").value; $("input").value = ""; ask(q); } });
$("nudgeBtn").addEventListener("click", nudge);
$("resetBtn").addEventListener("click", reset);

loadContext();
</script>
</body>
</html>
