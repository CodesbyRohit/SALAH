[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "salah"
version = "0.1.0"
description = "SALAH — backend for merchant insights"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
    "pydantic>=2.6",
]

[project.scripts]
salah = "backend.main:app"

[tool.vercel]
runtime = "python3.12"

[[tool.vercel.env]]
src = "backend"
